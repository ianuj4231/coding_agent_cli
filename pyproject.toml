[project]
name = "claude-rag-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "I Anuj",email = "ianuj@example.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "openai (>=3.5.0,<4.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.17,<2.0.0)",
    "langchain-openai (>=1.6.0,<2.0.0)",
    "langchain-anthropic (>=1.6.1,<2.0.0)",
    "langchain-mcp-adapters (>=0.3.0,<1.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "qdrant-client (>=1.19.0,<2.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "langgraph-checkpoint-mysql[pymysql] (>=3.0.0,<4.0.0)",
    "langgraph-checkpoint-sqlite (>=3.1.1,<4.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=7.4.1,<8.0.0)",
    "redisvl (>=0.23.0,<0.24.0) ; python_version >= \"3.12\" and python_version < \"3.15\"",
    "langchain-google-genai (>=4.4.0,<5.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "ia_claude"}]

[tool.poetry.scripts]
ia_claude = "ia_claude.main:run"
